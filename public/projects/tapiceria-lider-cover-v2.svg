<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tapicería Líder</title>
  <desc id="desc">Portada basada en la identidad de Líder, especialistas en volantes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.45" stop-color="#090909"/>
      <stop offset="1" stop-color="#020202"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset="0.18" stop-color="#8f9397"/>
      <stop offset="0.42" stop-color="#dedede"/>
      <stop offset="0.7" stop-color="#5d6063"/>
      <stop offset="1" stop-color="#b9bdc1"/>
    </linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.2" fill="#ffffff" opacity=".07"/>
      <circle cx="18" cy="14" r="1" fill="#ffffff" opacity=".05"/>
      <path d="M1 22c7-4 13-4 21 0" fill="none" stroke="#ffffff" stroke-width="1" opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity=".7"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grain)"/>
  <ellipse cx="800" cy="720" rx="610" ry="95" fill="#000" opacity=".62"/>
  <g filter="url(#shadow)" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif">
    <text x="800" y="490" font-size="252" font-weight="900" font-style="italic" letter-spacing="-16" fill="url(#steel)" stroke="#36383a" stroke-width="4">LÍDER</text>
  </g>
  <rect x="270" y="535" width="1060" height="4" rx="2" fill="#7f1d1d"/>
  <text x="800" y="615" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="500" letter-spacing="18" fill="#aeb2b7">ESPECIALISTAS EN VOLANTES</text>
  <g opacity=".22">
    <path d="M345 275C510 130 1090 130 1255 275" fill="none" stroke="#6b7280" stroke-width="3"/>
    <path d="M420 695C580 790 1020 790 1180 695" fill="none" stroke="#6b7280" stroke-width="2"/>
  </g>
</svg>

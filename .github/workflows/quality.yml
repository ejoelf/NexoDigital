name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate local CRM configuration
        shell: bash
        run: |
          grep -Fxq "VITE_API_BASE_URL=http://localhost:4000" .env.development
          if grep -Eq '^VITE_API_BASE_URL=https?://[^ ]+/api/?$' .env.development; then
            echo "VITE_API_BASE_URL must not include /api because CRM service paths already include it."
            exit 1
          fi
          npx vite build --mode development --outDir dist-development
          grep -R -q "http://localhost:4000" dist-development/assets
          rm -rf dist-development

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            lint.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexodigital-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Repair known JSX spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path("src/components").glob("*.jsx"):
              source = path.read_text(encoding="utf-8")
              fixed = source.replace('{" ""}', '{" "}')
              if fixed != source:
                  path.write_text(fixed, encoding="utf-8")
                  changed.append(str(path))

          print("Corrected:", ", ".join(changed) if changed else "none")
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components
            git commit -m "fix(ui): corregir espacios JSX invalidos"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Build
        if: always()
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            lint.log
            build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload production build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nexodigital-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
